[package]
name = "fei"
version = "1.0.0"
description = "Isomorphic split keyboard instrument"
authors = ["Fei"]
edition = "2021"

[lib]
name = "fei_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
log = "0.4"
env_logger = "0.11"
once_cell = "1.19"
parking_lot = "0.12"
tokio = { version = "1", features = ["sync"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
